<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LA PASTILLE – SAISON 26/27</title>
<style>
  :root {
    --accent: #f5b301;        /* couleur club (or) */
    --card-bg: rgba(15, 18, 26, 0.82);
    --card-border: rgba(255, 255, 255, 0.10);
    --text: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.65);
    --green: #35c26b;
    --red: #e5484d;
    /* Image de fond (photo d'équipe / terrain) : remplacez l'URL ci-dessous.
       Vous pouvez aussi utiliser un fichier local : url("mon-equipe.jpg") */
    --background-image: linear-gradient(rgba(10,12,18,.78), rgba(10,12,18,.78)),
                        url("./pics/RM3.png");
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    min-height: 100vh;
    background: var(--background-image) center / cover no-repeat fixed, #0a0c12;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 48px;
  }

  /* ===== En-tête ===== */
  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    border: 2px solid var(--accent);
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; text-align: center; color: var(--text-muted);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .titles { text-align: left; }
  .titles h1 {
    font-size: clamp(26px, 5vw, 42px);
    letter-spacing: 2px;
    font-weight: 900;
    color: var(--accent);
    text-transform: uppercase;
  }
  .titles h2 {
    font-size: clamp(13px, 2.4vw, 18px);
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--text);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ===== Liste des joueurs ===== */
  .ranking {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .player {
    display: grid;
    grid-template-columns: 56px 72px 1fr auto 52px;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 10px 14px;
    backdrop-filter: blur(4px);
    transition: transform .15s ease, border-color .15s ease;
  }
  .player:hover { transform: translateY(-2px); border-color: var(--accent); }
  .player.first { border-color: var(--accent); box-shadow: 0 0 18px rgba(245,179,1,.25); }

  /* Position */
  .pos {
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px;
    background: #2a2f3a;
    color: var(--text);
    border: 2px solid rgba(255,255,255,.15);
  }
  .player.first .pos { background: linear-gradient(135deg, #f5b301, #d18f00); color: #1a1400; border-color: #fff3; }

  /* Photo */
  .photo {
    width: 64px; height: 64px;
    border-radius: 12px;
    background: #2a2f3a;
    border: 2px solid rgba(255,255,255,.12);
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; /* silhhouette par défaut si pas de photo */
    overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo.empty::after { content: "🏀"; }

  /* Nom */
  .name { display: flex; flex-direction: column; min-width: 0; }
  .name .n { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .p { font-size: 13px; color: var(--text-muted); }

  /* Points */
  .pts {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.10);
  }
  .pts .v { font-weight: 900; font-size: 20px; color: var(--accent); }
  .pts .l { font-size: 10px; letter-spacing: 1px; color: var(--text-muted); }
  .pts.zero .v { color: var(--text-muted); }

  /* Tendance */
  .trend { display: flex; align-items: center; justify-content: center; width: 44px; }
  .badge {
    font-weight: 800; font-size: 13px;
    min-width: 36px; height: 30px;
    padding: 0 6px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    gap: 3px;
  }
  .badge.up   { background: rgba(53,194,107,.18); color: var(--green); border: 1px solid rgba(53,194,107,.4); }
  .badge.down { background: rgba(229,72,77,.18);  color: var(--red);   border: 1px solid rgba(229,72,77,.4); }
  .badge.same { color: var(--text-muted); }

  footer { margin-top: 28px; color: var(--text-muted); font-size: 12px; letter-spacing: 1px; }

  @media (max-width: 560px) {
    .player { grid-template-columns: 44px 54px 1fr auto 40px; gap: 10px; padding: 8px 10px; }
    .pos { width: 36px; height: 36px; font-size: 16px; }
    .photo { width: 50px; height: 50px; }
    .name .n { font-size: 15px; }
    .logo { width: 56px; height: 56px; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo" id="clubLogo">Logo du club</div>
    <div class="titles">
      <h1>La Pastille</h1>
      <h2>SENIOR RM3</h2>
      <h2><i>Saison 2026/2027</i></h2>
    </div>
  </header>

  <main class="ranking" id="ranking"></main>

  <footer>MAINTENU AVEC 💗 PAR VOTRE COACH</footer>

<script>
/* ============================================================
   DONNÉES – modifiez simplement ce tableau (page statique).
   - pos      : position dans le classement (1, 2, 3…)
   - photo    : chemin/URL de la photo ("" = silhouette par défaut)
   - prenom / nom
   - pts      : nombre de points (0 = "pas de point", affiché "0")
   - trend    : +1, +2, +3 = monte de n places ; -1, -2 = descend ; 0 = stable
   Pour la photo de fond : remplacez l'URL dans --background-image (CSS, en haut).
   Pour le logo : remplacez le contenu de src dans la balise <img> du clubLogo
   dans le script ci-dessous.
   ============================================================ */
const PLAYERS = [
  { pos: 1,  photo: "pics/jm.png", prenom: "Jordan",  nom: "MEGE",        pts: 4, trend: 0, team: "FEYTIAT BASKET 87",  trophy: true },
  { pos: 2,  photo: "pics/ng.png", prenom: "Nabil",   nom: "GOUDARD",     pts: 3, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 2,  photo: "./pics/RS.jpg", prenom: "Robin",   nom: "SENEJOUX",    pts: 3, trend: 1, team: "LA PATATE SARLADAISE BASKET CLUB" },
  { pos: 4,  photo: "pics/at.png", prenom: "Alexis",  nom: "THOMANN",     pts: 1, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 4,  photo: "pics/rf.png", prenom: "Romain",  nom: "FAURE",       pts: 1, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 4,  photo: "pics/mi.png", prenom: "Mathis",  nom: "INDACOCHEA",  pts: 1, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 4,  photo: "./pics/noname.webp", prenom: "Maxime",  nom: "GRAND",       pts: 1, trend: 0, team: "FEYTIAT BASKET 87 LOISIRS" },
  { pos: 4,  photo: "./pics/KD.jpg", prenom: "Killian", nom: "DEVAUD",     pts: 1, trend: 0, team: "FEYTIAT BASKET 87 LOISIRS" },
  { pos: 4,  photo: "pics/noe.png", prenom: "Noé",     nom: "DE SARLAT",   pts: 1, trend: 0, team: "LA PATATE SARLADAISE BASKET CLUB"  },
  { pos: 4, photo: "pics/vp.png", prenom: "Valentin",nom: "PERROT",      pts: 1, trend: 1, team: "FEYTIAT BASKET 87" },
  { pos: 4, photo: "pics/ab.png", prenom: "Antoine", nom: "BOUGOUIN",    pts: 1, trend: 1, team: "FEYTIAT BASKET 87" },
  { pos: 11, photo: "pics/jc.png", prenom: "Joachim", nom: "CHAUVELOT",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 11, photo: "./pics/noname.webp", prenom: "Thomas", nom: "",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87 LOISIRS" },
  { pos: 11, photo: "pics/lb.png", prenom: "Lucas", nom: "BAUDUIN",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 11, photo: "pics/ll.png", prenom: "Léandre", nom: "LACORE",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 11, photo: "pics/pr.png", prenom: "Pascal", nom: "RIDEL",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87" },
  { pos: 11, photo: "pics/cd.png", prenom: "Corentin", nom: "DEVARISSIAS",    pts: 0, trend: 0, team: "FEYTIAT BASKET 87" }
];

/* Logo du club – remplacez la ligne ci-dessous par :
   document.getElementById("clubLogo").innerHTML = '<img src="logo-club.png" alt="Logo">'; */
document.getElementById("clubLogo").innerHTML = '<img src="https://www.feytiatbasket87.com/media/uploaded/sites/20931/association/63bdcd79c29bc_LogoFeytiatBasket87encerclepetitformat.jpg" alt="Logo FEYTIAT BASKET 87">';

function trendBadge(t) {
  if (t > 0) return `<span class="badge up">▲${t > 1 ? t : ""}</span>`;
  if (t < 0) return `<span class="badge down">▼${t < -1 ? -t : ""}</span>`;
  return `<span class="badge same">—</span>`;
}

document.getElementById("ranking").innerHTML = PLAYERS.map(p => `
  <div class="player${p.pos === 1 ? " first" : ""}">
    <div class="pos">${p.pos}${p.trophy ? " 🏆" : ""}</div>
    <div class="photo${p.photo ? "" : " empty"}">${p.photo ? `<img src="${p.photo}" alt="${p.prenom} ${p.nom}">` : ""}</div>
    <div class="name">
      ${p.prenom}<span class="n"> ${p.nom}</span>
      <span class="p">${p.team}</span>
    </div>
    <div class="pts${p.pts === 0 ? " zero" : ""}">
      <span class="v">${p.pts}</span>
      <span class="l">PTS</span>
    </div>
    <div class="trend">${trendBadge(p.trend)}</div>
  </div>
`).join("");
</script>
</body>
</html>
